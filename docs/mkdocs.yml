site_name: Microscopy Image Browser documentation
site_url: https://mib.helsinki.fi
extra_css:    # location for additional css styles
  - css/styles.css  # Relative to the docs/ directory
  #- css/style_tests.css  # Relative to the docs/ directory for testing styles
extra_javascript:   # location for additional javascript files
  - css/extra.js

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono # Roboto Mono
  logo: assets/mib_icon.png   # logo for the top left corner
  favicon: assets/mib_icon.png   # icon for browser tab

  features:
    - content.code.copy   # add copy button to the code blocks
    - navigation.top      # add back to top button
    - navigation.instant.progress     # progress indicator at the top of the page and will be hidden once the page has fully loaded
    #- navigation.tracking     # When anchor tracking is enabled, the URL in the address bar is automatically updated with the active anchor as highlighted in the table of contents.
    #- navigation.tabs       # top-level sections are rendered in a menu layer below the header for viewports above 1220px, but remain as-is on mobile
    #- navigation.tabs.sticky # make the tabs sticky
    - navigation.sections     # When sections are enabled, top-level sections are rendered as groups in the sidebar for viewports above 1220px, but remain as-is on mobile.
    #- navigation.expand       # When expansion is enabled, the left sidebar will expand all collapsible subsections by default, so the user doesn't have to open subsections manually.
    #- navigation.prune        # [not compatible with navigation.expand] When pruning is enabled, only the visible navigation items are included in the rendered HTML, reducing the size of the built site by 33% or more
    - navigation.path       # When navigation paths are activated, a breadcrumb navigation is rendered above the title of each page, which might make orientation easier for users visiting your documentation on devices with smaller screens.
    - navigation.indexes    # When section index pages are enabled, documents can be directly attached to sections, which is particularly useful for providing overview pages.
    - content.footnote.tooltips   # add tooltips [^1]
    - content.tooltips        # add tooltips
    - content.images.lightbox  # Enable lightbox for images
    # - navigation.footer      # add footer with navigation
    - search.suggest        # add search suggestions
    - header.autohide       # autohide header after certain threshold

  icon:
    annotation: material/chevron-right-circle   # icon for annotations

  palette:
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green   # primary color
      accent: orange    # color for highlighting links

    # Light mode
    - scheme: default   # default -> white, slate->black
      toggle:
        icon: material/weather-night
        name: Dark mode
      # primary: green #'#F28C38'  # primary color, overridden in styles.css [data-md-color-scheme="bright"]
      # accent: '#2E6B47'   # color for highlighting links, https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/

extra:
  homepage: https://mib.helsinki.fi/help/main2/   # link that is activated upon press on logo
  social:
    - icon: fontawesome/solid/house-chimney
      link: https://mib.helsinki.fi
    - icon: fontawesome/brands/github         # bundled icons location: site-packages\material\templates\.icons
      link: https://github.com/Ajaxels/MIB3


copyright: Copyright &copy; 2010 - 2025 Ilya Belevich

