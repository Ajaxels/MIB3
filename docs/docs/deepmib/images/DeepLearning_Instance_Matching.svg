<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 815" width="760" height="815" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Matching of predicted objects with real objects, and the scores computed from it</title>
  <defs>
    <clipPath id="leftHalf"><rect x="40" y="50" width="340" height="300"/></clipPath>
    <clipPath id="rightHalf"><rect x="380" y="50" width="340" height="300"/></clipPath>
    <clipPath id="iouRealTop"><circle cx="615" cy="612" r="26"/></clipPath>
  </defs>

  <!-- card, so the scheme reads the same on light and dark pages -->
  <rect x="0" y="0" width="760" height="815" rx="12" fill="#ffffff"/>

  <!-- A. the two halves: where real objects are, and where there is none -->
  <text x="210" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#1c5cab">Real objects (ground truth)</text>
  <text x="550" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#555555">No real object</text>
  <rect x="40" y="50" width="340" height="300" fill="#e6f0fb"/>
  <rect x="380" y="50" width="340" height="300" fill="#f3f2ee"/>

  <!-- objects found by the network: the circle; split by the halves into TP and FP -->
  <circle cx="380" cy="200" r="125" fill="#c8ecdc" clip-path="url(#leftHalf)"/>
  <circle cx="380" cy="200" r="125" fill="#fbdccd" clip-path="url(#rightHalf)"/>
  <rect x="40" y="50" width="680" height="300" fill="none" stroke="#9a9a9a" stroke-width="1.5"/>
  <line x1="380" y1="50" x2="380" y2="350" stroke="#9a9a9a" stroke-width="1.5"/>
  <circle cx="380" cy="200" r="125" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="380" y="68" text-anchor="middle" font-size="14" font-style="italic" fill="#333333">Objects found by the network</text>

  <!-- real objects: solid dots (left half) -->
  <g fill="#1f3b57">
    <circle cx="80" cy="95" r="7"/><circle cx="150" cy="85" r="7"/><circle cx="225" cy="110" r="7"/>
    <circle cx="100" cy="165" r="7"/><circle cx="175" cy="150" r="7"/><circle cx="230" cy="205" r="7"/>
    <circle cx="70" cy="240" r="7"/><circle cx="140" cy="225" r="7"/><circle cx="205" cy="280" r="7"/>
    <circle cx="300" cy="125" r="7"/><circle cx="348" cy="125" r="7"/><circle cx="283" cy="170" r="7"/>
    <circle cx="358" cy="165" r="7"/><circle cx="290" cy="255" r="7"/><circle cx="338" cy="268" r="7"/>
  </g>
  <!-- wrong objects found by the network: hollow circles (right half, inside the circle) -->
  <g fill="#ffffff" stroke="#b8461d" stroke-width="2.5">
    <circle cx="425" cy="130" r="7"/><circle cx="472" cy="172" r="7"/>
    <circle cx="418" cy="265" r="7"/><circle cx="466" cy="248" r="7"/>
  </g>

  <!-- region names -->
  <text x="320" y="214" text-anchor="middle" font-size="26" font-weight="700" fill="#128a5f">TP</text>
  <text x="442" y="214" text-anchor="middle" font-size="26" font-weight="700" fill="#b8461d">FP</text>
  <text x="62" y="334" font-size="22" font-weight="700" fill="#1c5cab">FN</text>
  <text x="700" y="334" text-anchor="end" font-size="22" font-weight="700" fill="#777777">TN</text>

  <!-- B. legend -->
  <g font-size="14" fill="#222222">
    <rect x="40" y="377" width="18" height="18" fill="#c8ecdc" stroke="#128a5f" stroke-width="1.5"/>
    <text x="68" y="391"><tspan font-weight="700">TP</tspan> (true positive) - real object found; outlines overlap by at least the IoU threshold</text>
    <rect x="40" y="405" width="18" height="18" fill="#fbdccd" stroke="#b8461d" stroke-width="1.5"/>
    <text x="68" y="419"><tspan font-weight="700">FP</tspan> (false positive) - wrong object: found by the network, but no real object matches it</text>
    <rect x="40" y="433" width="18" height="18" fill="#e6f0fb" stroke="#1c5cab" stroke-width="1.5"/>
    <text x="68" y="447"><tspan font-weight="700">FN</tspan> (false negative) - real object the network missed</text>
    <rect x="40" y="461" width="18" height="18" fill="#f3f2ee" stroke="#9a9a9a" stroke-width="1.5"/>
    <text x="68" y="475"><tspan font-weight="700">TN</tspan> (true negative) - background correctly left empty; not counted, as it holds no objects</text>
  </g>
  <g font-size="14" fill="#222222">
    <circle cx="49" cy="499" r="7" fill="#1f3b57"/>
    <text x="68" y="504">real object</text>
    <circle cx="183" cy="499" r="7" fill="#ffffff" stroke="#b8461d" stroke-width="2.5"/>
    <text x="202" y="504">wrong object found by the network</text>
  </g>
  <line x1="40" y1="525" x2="720" y2="525" stroke="#dddddd" stroke-width="1"/>

  <!-- C. the scores as fractions of the regions above -->
  <g text-anchor="middle">
    <text x="130" y="555" font-size="17" font-weight="700" fill="#222222">Precision</text>
    <text x="130" y="574" font-size="13" fill="#555555">share of found objects that are real</text>
    <text x="380" y="555" font-size="17" font-weight="700" fill="#222222">Recall</text>
    <text x="380" y="574" font-size="13" fill="#555555">share of real objects that were found</text>
    <text x="630" y="555" font-size="17" font-weight="700" fill="#222222">IoU</text>
    <text x="630" y="574" font-size="13" fill="#555555">overlap of two outlines</text>
  </g>

  <!-- precision: TP part of the circle / whole circle -->
  <path d="M130,612 m0,-28 a28,28 0 0,0 0,56 z" fill="#c8ecdc" stroke="#128a5f" stroke-width="1.5"/>
  <line x1="85" y1="655" x2="175" y2="655" stroke="#333333" stroke-width="2"/>
  <path d="M130,702 m0,-28 a28,28 0 0,0 0,56 z" fill="#c8ecdc"/>
  <path d="M130,702 m0,-28 a28,28 0 0,1 0,56 z" fill="#fbdccd"/>
  <circle cx="130" cy="702" r="28" fill="none" stroke="#333333" stroke-width="1.5"/>

  <!-- recall: TP part of the circle / whole left half (real objects) -->
  <path d="M400,612 m0,-28 a28,28 0 0,0 0,56 z" fill="#c8ecdc" stroke="#128a5f" stroke-width="1.5"/>
  <line x1="335" y1="655" x2="425" y2="655" stroke="#333333" stroke-width="2"/>
  <rect x="340" y="670" width="60" height="64" fill="#e6f0fb" stroke="#1c5cab" stroke-width="1.5"/>
  <path d="M400,702 m0,-28 a28,28 0 0,0 0,56 z" fill="#c8ecdc" stroke="#128a5f" stroke-width="1.5"/>

  <!-- IoU: overlap of a real and a predicted outline / their combined area -->
  <circle cx="645" cy="612" r="26" fill="#1baf7a" clip-path="url(#iouRealTop)"/>
  <circle cx="615" cy="612" r="26" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="645" cy="612" r="26" fill="none" stroke="#eb6834" stroke-width="2"/>
  <line x1="580" y1="655" x2="680" y2="655" stroke="#333333" stroke-width="2"/>
  <circle cx="615" cy="702" r="26" fill="#9fdcc4"/>
  <circle cx="645" cy="702" r="26" fill="#9fdcc4"/>
  <circle cx="615" cy="702" r="26" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="645" cy="702" r="26" fill="none" stroke="#eb6834" stroke-width="2"/>

  <g text-anchor="middle" font-size="15" fill="#222222">
    <text x="130" y="762">TP / (TP + FP)</text>
    <text x="380" y="762">TP / (TP + FN)</text>
    <text x="630" y="762">overlap / combined area</text>
  </g>
  <g font-size="12.5" fill="#555555">
    <circle cx="580" cy="784" r="5" fill="none" stroke="#2a78d6" stroke-width="2"/>
    <text x="590" y="788">real</text>
    <circle cx="634" cy="784" r="5" fill="none" stroke="#eb6834" stroke-width="2"/>
    <text x="644" y="788">predicted</text>
  </g>
</svg>
