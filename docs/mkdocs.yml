markdown_extensions:
  - attr_list
  - pymdownx.emoji:       # to enable use of icons and emoji inline as :octicons-gear-16:
      emoji_index: !!python/name:material.extensions.emoji.twemoji      # to enable use of icons and emoji inline as :octicons-gear-16:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg   # to enable use of icons and emoji inline as :octicons-gear-16:
  - pymdownx.highlight:   # enable highlighting of the code: https://squidfunk.github.io/mkdocs-material/reference/code-blocks/
      anchor_linenums: true   # Requires to add "~~~matlab"  in front of the code block
      line_spans: __span      # or "~~~py" in front of the code block for python
      pygments_lang_class: true   # https://pygments.org/docs/lexers/
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:              # add tabs,
      alternate_style: true       # https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown-extensions/?h=tabbed#tabbed
  - pymdownx.keys                 # enable keys, https://facelessuser.github.io/pymdown-extensions/extensions/keys/#extendingmodifying-key-map-index
  - pymdownx.caret                # enable caret to make subscripts H~2~O and super scripts: https://squidfunk.github.io/mkdocs-material/reference/formatting/
  - pymdownx.tilde                # and superscripts A^T^A
  - admonition                    # info boxes
  - pymdownx.details              # https://squidfunk.github.io/mkdocs-material/reference/admonitions/?h=admonitions
  - pymdownx.superfences
  - tables                        # add tables: https://squidfunk.github.io/mkdocs-material/reference/data-tables/
  - footnotes                     # add footnotes and tooltips: https://squidfunk.github.io/mkdocs-material/reference/footnotes/#fn:1
  - md_in_html                    # grid cards, images https://squidfunk.github.io/mkdocs-material/reference/grids/
  - pymdownx.blocks.caption       # for caption alignment
  - def_list                      # Definition Lists: https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown/#definition-lists
  - pymdownx.tasklist:          # task lists https://squidfunk.github.io/mkdocs-material/reference/lists/#using-task-lists
      custom_checkbox: true

plugins:
  - glightbox:                    # add image zoom functionality, https://squidfunk.github.io/mkdocs-material/reference/images/ requires "pip install mkdocs-glightbox"
      effect: none                # Name of the effect on lightbox open. (zoom, fade, none)
      zoomable: true              # Enable or disable zoomable images
      skip_classes:               # Disable lightbox of those image with specific custom class name
        - skip-lightbox           # do not use lightbox, requires {.off-glb  } tag after the image
      manual: true                # require to use {on-glb} to show lightbox
      background: none            # The background CSS of lightbox image. The background will shown when the image is transparent. You can use any CSS value for the background for example #74b9ff or Gainsboro or none for nothing.
      shadow: false               # Enable or disable the shadow of lightbox image. Disable it when the background is none to prevent shadow around the transparent image.
      touchNavigation: true       # Enable or disable the touch navigation (swipe).
      loop: false                 # Loop slides on end
      slide_effect: fade          # Name of the effect on lightbox slide. (slide, zoom, fade, none)
      width: 100%                 # Width for inline elements and iframes. You can use any unit for example 90% or 100vw for full width.
      height: auto                # Height for inline elements and iframes. You can use any unit for example 90%, 100vh or auto
      draggable: false            # Enable or disable mouse drag to go prev and next slide.
      auto_caption: true         # Enable or disable using alt of image as caption title automatically.
      caption_position: bottom    # Default captions position. (bottom, top, left, right)
  - search                         # add Search
  - offline                       # The built-in offline plugin makes sure that the site search works when you distribute the contents of your site directory as a download
