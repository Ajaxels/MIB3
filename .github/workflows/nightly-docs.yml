# Publishes the committed user guide build (docs/html) to GitHub Pages as the documentation of the
# nightly version: https://ajaxels.github.io/MIB3/
# The release documentation stays on https://mib.helsinki.fi/help/main3/ (uploaded by hand).
# Runs when a push to master changes docs/html or this file; can also be started from the Actions tab.

name: Nightly docs

on:
  push:
    branches: [master]
    paths: ['docs/html/**', '.github/workflows/nightly-docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/html
      - id: deployment
        uses: actions/deploy-pages@v5
